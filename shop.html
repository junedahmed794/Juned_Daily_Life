<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <meta name="description" content="Shared shopping list">
  <!-- No manifest on purpose: iPhone then keeps the private ?list= link when added to the Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Shopping">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="shop-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="shop-icon.png">
  <script>try { const t = localStorage.getItem('theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="styles.css">
  <style>body { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }</style>
  <title>Shopping List</title>
</head>
<body>
  <header class="topbar">
    <h1>🛒 Shopping</h1>
    <span>
      <button class="icon-btn menu-btn" id="refreshBtn" data-refresh aria-label="Refresh"><svg viewBox="0 0 24 24" width="25" height="25" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn" id="themeBtn" aria-label="Change colour theme">🎨</button>
      <button class="icon-btn" id="bell" aria-label="Notifications" hidden>🔕</button>
      <button class="icon-btn" id="who" aria-label="Change your name">👤</button>
    </span>
  </header>
  <main id="view"></main>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="theme.js"></script>
  <script src="config.js"></script>
  <script src="shop.js"></script>
  <script>
  'use strict';
  (() => {
    const mem = {};   // fallback if the browser blocks saving
    const get = k => { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch { /* blocked */ } return mem[k] ?? null; };
    const set = (k, v) => { mem[k] = v; try { localStorage.setItem(k, v); } catch { /* blocked */ } };
    const view = document.getElementById('view');

    const fromLink = new URLSearchParams(location.search).get('list');
    if (fromLink) set('shop-code', fromLink);
    const code = fromLink || get('shop-code') || '';
    let device = get('shop-device');
    if (!device) { device = Shop.newCode().slice(0, 16); set('shop-device', device); }
    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

    let toastTimer;
    function toast(msg, undo) {
      const el = document.getElementById('toast');
      el.textContent = '';
      el.append(Object.assign(document.createElement('span'), { textContent: msg }));
      if (undo) {
        const b = Object.assign(document.createElement('button'), { type: 'button', textContent: 'Undo' });
        b.onclick = () => { undo(); el.classList.remove('show'); };
        el.append(b);
      }
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), undo ? 4500 : 2500);
    }

    function render() {
      if (!/^[A-Za-z0-9_-]{20,64}$/.test(code)) {
        view.innerHTML = '<p class="empty" style="text-align:center">Open the shopping list link you were sent to see the list.</p>';
        return;
      }
      if (!get('shop-name')) {
        if (document.getElementById('nameForm')) return;   // never wipe what is being typed
        view.innerHTML = `<form class="card" id="nameForm">
          <h2>Welcome 👋</h2>
          <p class="meta">What's your name? It shows next to the items you add.</p>
          <input name="n" required autocomplete="given-name" placeholder="Your name" maxlength="30" aria-label="Your name">
          <button class="btn primary block" style="margin-top:10px">Continue</button>
        </form>`;
        return;
      }
      if (Shop.isTyping()) return;
      view.innerHTML = Shop.html() + (standalone ? '' :
        '<p class="meta" style="text-align:center;margin-top:18px">Tip: tap <b>Share → Add to Home Screen</b> to keep this list as an app.</p>');
      Shop.mounted();
    }

    // ---------- notifications (new items, "shopping now", "trip done") ----------
    const bell = document.getElementById('bell');
    const canPush = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && !!PUSH_SERVER;
    const post = (path, data) => fetch(`${PUSH_SERVER}${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    const keyBytes = k => Uint8Array.from(atob(k.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - (k.length % 4)) % 4)), c => c.charCodeAt(0));
    const showBell = () => { bell.hidden = false; bell.textContent = get('shop-notify') === '1' ? '🔔' : '🔕'; };

    async function syncPush() {
      const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();
      if (!sub) return false;
      const res = await post('/sync', { id: device, subscription: sub.toJSON(), tz: Intl.DateTimeFormat().resolvedOptions().timeZone, reminders: [], lists: [code], app: 'shop' });
      return res.ok;
    }

    async function toggleNotify() {
      if (!canPush()) { toast(standalone ? 'Notifications aren’t supported here' : 'Add this list to your Home Screen first, then open it from there'); return; }
      if (get('shop-notify') === '1') {
        try { const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription(); if (sub) await sub.unsubscribe(); await post('/unsubscribe', { id: device }); } catch { /* ignore */ }
        set('shop-notify', '0'); showBell(); toast('Notifications off'); return;
      }
      const perm = await Notification.requestPermission();   // must run straight from the tap
      if (perm !== 'granted') { toast('Notifications are blocked — allow them in iPhone Settings → Notifications'); return; }
      try {
        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
          const { publicKey } = await (await fetch(`${PUSH_SERVER}/key`)).json();
          sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(publicKey) });
        }
        if (!(await syncPush())) throw new Error('sync');
        await post('/test', { id: device });
        set('shop-notify', '1'); showBell(); toast('Notifications on 🔔');
      } catch { toast('Could not turn on notifications — try again'); }
    }
    bell.addEventListener('click', toggleNotify);

    // 🎨 cycles through the colour themes
    document.getElementById('themeBtn').addEventListener('click', () => {
      const keys = Object.keys(THEMES), next = keys[(keys.indexOf(currentTheme()) + 1) % keys.length];
      applyTheme(next);
      toast(`🎨 ${THEMES[next].name} theme · ${THEMES[next].hint}`);
    });

    function start() {
      render();
      if (!get('shop-name')) return;   // load the list only once we know who this is
      Shop.init({ code, name: get('shop-name'), device, onChange: render, onMessage: toast });
      render();
      Shop.start();
    }

    document.addEventListener('submit', e => {
      if (e.target.id !== 'nameForm') return;
      e.preventDefault();
      const n = e.target.n.value.trim();
      if (!n) return;
      set('shop-name', n);
      start();
    });

    document.getElementById('who').addEventListener('click', () => {
      const n = prompt('Your name (shown next to items you add):', get('shop-name') || '');
      if (n && n.trim()) { set('shop-name', n.trim().slice(0, 30)); start(); }
    });

    if ('serviceWorker' in navigator && PUSH_SERVER) {
      navigator.serviceWorker.register('sw.js').then(() => {
        showBell();
        if (get('shop-notify') === '1') syncPush().catch(() => {});
      }).catch(() => {});
    }

    start();
  })();
  </script>
</body>
</html>
