<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Juned Daily — tasks, habits, money and journal in one place.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Juned Daily">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-512.png">
  <script>try { const t = localStorage.getItem('theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="styles.css">
  <title>Juned Daily</title>
</head>
<body>
  <header class="topbar">
    <h1 id="title">Today</h1>
    <button id="settingsBtn" class="icon-btn" data-action="settings" aria-label="Settings">⚙︎</button>
  </header>

  <main id="view"></main>

  <nav class="tabs" aria-label="Sections">
    <button data-action="go" data-tab="today"><span>☀️</span>Today</button>
    <button data-action="go" data-tab="tasks"><span>✅</span>Tasks</button>
    <button data-action="go" data-tab="habits"><span>🔁</span>Habits</button>
    <button data-action="go" data-tab="money"><span>💰</span>Money</button>
    <button data-action="go" data-tab="office"><span>💼</span>Office</button>
    <button data-action="go" data-tab="shop"><span>🛒</span>Shop</button>
    <button data-action="go" data-tab="journal"><span>📓</span>Journal</button>
  </nav>

  <button id="fab" class="fab" data-action="quick" aria-label="Quick add">+</button>
  <dialog id="sheet"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="theme.js"></script>
  <script src="config.js"></script>
  <script src="shop.js"></script>
  <script src="xlsx.js"></script>
  <script src="celebrate.js"></script>
  <script src="quickadd.js"></script>
  <script src="insights.js"></script>
  <script src="app.js"></script>
</body>
</html>
